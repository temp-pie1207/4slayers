<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="100%" height="100%">
  <defs>
    <linearGradient id="smsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181512"/>
      <stop offset="100%" stop-color="#0E0C0A"/>
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3DFB0"/>
      <stop offset="50%" stop-color="#C69A42"/>
      <stop offset="100%" stop-color="#906727"/>
    </linearGradient>
    <linearGradient id="alertRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B42332"/>
      <stop offset="100%" stop-color="#E5394B"/>
    </linearGradient>
    <filter id="smsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#C69A42" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Frame Background -->
  <rect width="480" height="320" rx="16" fill="url(#smsBg)" stroke="#332B20" stroke-width="1.5"/>
  <rect x="1" y="1" width="478" height="318" rx="15" fill="none" stroke="url(#goldGradient)" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Phone Header Bar -->
  <rect x="24" y="20" width="432" height="42" rx="10" fill="#201C16" stroke="#3D3425" stroke-width="1"/>
  <circle cx="44" cy="41" r="5" fill="#B42332"/>
  <text x="60" y="45" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#FBF8F0">
    +91 98210-XXXXX
  </text>
  <rect x="230" y="32" width="112" height="18" rx="4" fill="#B42332" fill-opacity="0.15" stroke="#B42332" stroke-width="0.8"/>
  <text x="238" y="44" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#FF6B7A">
    UNVERIFIED SENDER
  </text>
  <text x="390" y="45" font-family="'JetBrains Mono', monospace" font-size="10" fill="#777064">
    14:22:08
  </text>

  <!-- Incoming SMS Bubble -->
  <g filter="url(#smsGlow)">
    <rect x="24" y="76" width="432" height="152" rx="12" fill="#1C1813" stroke="#B42332" stroke-width="1.2" stroke-opacity="0.8"/>
    
    <!-- Warning Badge -->
    <rect x="36" y="88" width="138" height="20" rx="4" fill="#B42332" fill-opacity="0.2"/>
    <text x="44" y="102" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#FF8A96">
      ⚠ HIGH-RISK SMS PHISHING
    </text>

    <!-- SMS Message Text -->
    <text x="36" y="130" font-family="'Outfit', sans-serif" font-size="13" font-weight="500" fill="#FBF8F0">
      "Dear Customer, your SBI YONO account will be
    </text>
    <text x="36" y="150" font-family="'Outfit', sans-serif" font-size="13" font-weight="500" fill="#FBF8F0">
      blocked today. Update KYC mandatory to prevent freeze:
    </text>
    
    <!-- Malicious Link Highlighted -->
    <rect x="34" y="162" width="280" height="22" rx="4" fill="#B42332" fill-opacity="0.25" stroke="#B42332" stroke-width="1"/>
    <text x="42" y="177" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#FF7B88">
      https://sbi-kyc-verify-portal.net/login
    </text>
  </g>

  <!-- Forensic Inspection Annotations Footer -->
  <g transform="translate(24, 240)">
    <rect width="136" height="60" rx="8" fill="#15120E" stroke="#3D3425" stroke-width="1"/>
    <text x="12" y="22" font-family="'JetBrains Mono', monospace" font-size="9" fill="#9E9688">RISK SCORE</text>
    <text x="12" y="46" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="700" fill="#E5394B">96 / 100</text>
    <circle cx="118" cy="30" r="4" fill="#B42332"/>

    <rect x="148" width="136" height="60" rx="8" fill="#15120E" stroke="#3D3425" stroke-width="1"/>
    <text x="12" y="22" transform="translate(148,0)" font-family="'JetBrains Mono', monospace" font-size="9" fill="#9E9688">PSYCH TRIGGER</text>
    <text x="12" y="44" transform="translate(148,0)" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600" fill="#F3DFB0">Urgency Trap</text>

    <rect x="296" width="136" height="60" rx="8" fill="#15120E" stroke="#3D3425" stroke-width="1"/>
    <text x="12" y="22" transform="translate(296,0)" font-family="'JetBrains Mono', monospace" font-size="9" fill="#9E9688">HEADER AUDIT</text>
    <text x="12" y="44" transform="translate(296,0)" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600" fill="#C69A42">Spoofed Route</text>
  </g>
</svg>
