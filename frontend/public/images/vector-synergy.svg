<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="100%" height="100%">
  <defs>
    <linearGradient id="synBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181512"/>
      <stop offset="100%" stop-color="#0E0C0A"/>
    </linearGradient>
    <radialGradient id="goldCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FBF8F0"/>
      <stop offset="40%" stop-color="#C69A42"/>
      <stop offset="80%" stop-color="#906727"/>
      <stop offset="100%" stop-color="#241B08"/>
    </radialGradient>
  </defs>

  <rect width="480" height="320" rx="16" fill="url(#synBg)" stroke="#C69A42" stroke-width="1.5"/>

  <!-- Background Orbit Rings -->
  <circle cx="240" cy="160" r="120" fill="none" stroke="#C69A42" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="4,6"/>
  <circle cx="240" cy="160" r="80" fill="none" stroke="#C69A42" stroke-width="1" stroke-opacity="0.35"/>
  <circle cx="240" cy="160" r="45" fill="none" stroke="#C69A42" stroke-width="1.2" stroke-opacity="0.6"/>

  <!-- Dynamic Connecting Radiating Rays -->
  <line x1="240" y1="160" x2="120" y2="70" stroke="#C69A42" stroke-width="1.5" stroke-opacity="0.7"/>
  <line x1="240" y1="160" x2="360" y2="70" stroke="#C69A42" stroke-width="1.5" stroke-opacity="0.7"/>
  <line x1="240" y1="160" x2="90" y2="170" stroke="#C69A42" stroke-width="1.5" stroke-opacity="0.7"/>
  <line x1="240" y1="160" x2="390" y2="170" stroke="#C69A42" stroke-width="1.5" stroke-opacity="0.7"/>
  <line x1="240" y1="160" x2="140" y2="260" stroke="#C69A42" stroke-width="1.5" stroke-opacity="0.7"/>
  <line x1="240" y1="160" x2="340" y2="260" stroke="#C69A42" stroke-width="1.5" stroke-opacity="0.7"/>

  <!-- Satellite Threat Vector Badges -->
  <!-- 1. SMS -->
  <g transform="translate(70, 48)">
    <rect width="95" height="42" rx="8" fill="#1C1813" stroke="#C69A42" stroke-width="1"/>
    <text x="8" y="16" font-family="'JetBrains Mono', monospace" font-size="8" fill="#EAD6A0">VECTOR // SMS</text>
    <text x="8" y="30" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="600" fill="#FBF8F0">Phishing Probe</text>
  </g>

  <!-- 2. Typosquat URL -->
  <g transform="translate(315, 48)">
    <rect width="95" height="42" rx="8" fill="#1C1813" stroke="#C69A42" stroke-width="1"/>
    <text x="8" y="16" font-family="'JetBrains Mono', monospace" font-size="8" fill="#EAD6A0">VECTOR // URL</text>
    <text x="8" y="30" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="600" fill="#FBF8F0">Clone Replica</text>
  </g>

  <!-- 3. Quishing QR -->
  <g transform="translate(30, 148)">
    <rect width="95" height="42" rx="8" fill="#1C1813" stroke="#C69A42" stroke-width="1"/>
    <text x="8" y="16" font-family="'JetBrains Mono', monospace" font-size="8" fill="#EAD6A0">VECTOR // QR</text>
    <text x="8" y="30" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="600" fill="#FBF8F0">Reverse Debit</text>
  </g>

  <!-- 4. Telecom Spoof -->
  <g transform="translate(355, 148)">
    <rect width="95" height="42" rx="8" fill="#1C1813" stroke="#C69A42" stroke-width="1"/>
    <text x="8" y="16" font-family="'JetBrains Mono', monospace" font-size="8" fill="#EAD6A0">VECTOR // VOIP</text>
    <text x="8" y="30" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="600" fill="#FBF8F0">Spoofed Gateway</text>
  </g>

  <!-- 5. Forged OCR -->
  <g transform="translate(85, 238)">
    <rect width="95" height="42" rx="8" fill="#1C1813" stroke="#C69A42" stroke-width="1"/>
    <text x="8" y="16" font-family="'JetBrains Mono', monospace" font-size="8" fill="#EAD6A0">VECTOR // OCR</text>
    <text x="8" y="30" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="600" fill="#FBF8F0">Fake Notice</text>
  </g>

  <!-- 6. Mule UPI -->
  <g transform="translate(295, 238)">
    <rect width="95" height="42" rx="8" fill="#1C1813" stroke="#C69A42" stroke-width="1"/>
    <text x="8" y="16" font-family="'JetBrains Mono', monospace" font-size="8" fill="#EAD6A0">VECTOR // UPI</text>
    <text x="8" y="30" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="600" fill="#FBF8F0">Mule Cluster</text>
  </g>

  <!-- Central Scam DNA Neural Core -->
  <g transform="translate(240, 160)">
    <circle cx="0" cy="0" r="32" fill="url(#goldCore)"/>
    <circle cx="0" cy="0" r="32" fill="none" stroke="#FBF8F0" stroke-width="1.5" stroke-opacity="0.8"/>
    
    <!-- Inner emblem -->
    <text x="0" y="-4" text-anchor="middle" font-family="'Cinzel', serif" font-size="10" font-weight="800" fill="#1A1202">4SLAYERS</text>
    <text x="0" y="8" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="700" fill="#1A1202">SCAM DNA</text>
    <text x="0" y="18" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="6" font-weight="700" fill="#583B09">NEXUS</text>
  </g>

  <!-- Bottom banner -->
  <text x="240" y="300" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#C69A42">
    CROSS-CHANNEL THREAT CORRELATION ENGINE ACTIVE
  </text>
</svg>
