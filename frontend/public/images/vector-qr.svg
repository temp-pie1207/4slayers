<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="100%" height="100%">
  <defs>
    <linearGradient id="qrBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181512"/>
      <stop offset="100%" stop-color="#0E0C0A"/>
    </linearGradient>
    <linearGradient id="laserBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C69A42" stop-opacity="0"/>
      <stop offset="50%" stop-color="#C69A42" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#C69A42" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="480" height="320" rx="16" fill="url(#qrBg)" stroke="#332B20" stroke-width="1.5"/>

  <!-- Left: QR Code Scanner Representation -->
  <g transform="translate(24, 28)">
    <rect width="160" height="160" rx="12" fill="#13100D" stroke="#C69A42" stroke-width="1.5"/>
    
    <!-- Stylized QR Corners -->
    <rect x="18" y="18" width="34" height="34" rx="4" fill="none" stroke="#C69A42" stroke-width="3"/>
    <rect x="25" y="25" width="20" height="20" rx="2" fill="#C69A42"/>

    <rect x="108" y="18" width="34" height="34" rx="4" fill="none" stroke="#C69A42" stroke-width="3"/>
    <rect x="115" y="25" width="20" height="20" rx="2" fill="#C69A42"/>

    <rect x="18" y="108" width="34" height="34" rx="4" fill="none" stroke="#C69A42" stroke-width="3"/>
    <rect x="25" y="115" width="20" height="20" rx="2" fill="#C69A42"/>

    <!-- Matrix Pixels -->
    <rect x="64" y="20" width="8" height="8" fill="#C69A42"/>
    <rect x="76" y="20" width="8" height="8" fill="#C69A42"/>
    <rect x="88" y="28" width="8" height="8" fill="#C69A42"/>
    <rect x="64" y="38" width="8" height="8" fill="#C69A42"/>
    <rect x="80" y="44" width="8" height="8" fill="#B42332"/>
    <rect x="60" y="60" width="10" height="10" fill="#B42332"/>
    <rect x="80" y="60" width="10" height="10" fill="#C69A42"/>
    <rect x="100" y="60" width="10" height="10" fill="#B42332"/>
    <rect x="30" y="70" width="8" height="8" fill="#C69A42"/>
    <rect x="44" y="80" width="8" height="8" fill="#C69A42"/>
    <rect x="60" y="80" width="8" height="8" fill="#C69A42"/>
    <rect x="75" y="80" width="8" height="8" fill="#B42332"/>
    <rect x="90" y="80" width="8" height="8" fill="#C69A42"/>
    <rect x="115" y="75" width="8" height="8" fill="#C69A42"/>
    <rect x="130" y="85" width="8" height="8" fill="#C69A42"/>
    <rect x="64" y="105" width="8" height="8" fill="#C69A42"/>
    <rect x="85" y="115" width="8" height="8" fill="#B42332"/>
    <rect x="105" y="125" width="8" height="8" fill="#C69A42"/>
    <rect x="125" y="110" width="8" height="8" fill="#C69A42"/>

    <!-- Dynamic Scan Laser -->
    <rect x="8" y="75" width="144" height="6" fill="url(#laserBeam)"/>
    <line x1="8" y1="78" x2="152" y2="78" stroke="#F3DFB0" stroke-width="1.5"/>

    <text x="24" y="195" font-family="'JetBrains Mono', monospace" font-size="9" fill="#906727">
      [QUISHING PAYLOAD DETECTED]
    </text>
  </g>

  <!-- Right: Decoded Payload & Vulnerability Analysis -->
  <g transform="translate(204, 28)">
    <rect width="252" height="264" rx="12" fill="#15120E" stroke="#3D3425" stroke-width="1"/>
    
    <text x="16" y="24" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#EAD6A0">
      DECODED UPI PAYLOAD AUDIT
    </text>

    <!-- Raw String -->
    <rect x="14" y="34" width="224" height="48" rx="6" fill="#1C1813" stroke="#B42332" stroke-width="0.8"/>
    <text x="22" y="50" font-family="'JetBrains Mono', monospace" font-size="9" fill="#FF7B88">
      upi://pay?pa=refund-desk@icici
    </text>
    <text x="22" y="66" font-family="'JetBrains Mono', monospace" font-size="9" fill="#FF7B88">
      &amp;pn=Support&amp;am=25000&amp;cu=INR
    </text>

    <!-- Fraud Pattern Callout -->
    <g transform="translate(14, 94)">
      <rect width="224" height="56" rx="6" fill="#221114" stroke="#B42332" stroke-width="1"/>
      <text x="12" y="18" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#FF8A96">
        ⚠ Reverse-Collect Trap
      </text>
      <text x="12" y="34" font-family="'Outfit', sans-serif" font-size="10" fill="#FCA5A5">
        Victim told "Scan to receive ₹25,000 refund."
      </text>
      <text x="12" y="47" font-family="'Outfit', sans-serif" font-size="10" font-weight="600" fill="#FBF8F0">
        Execution actually DEBITS ₹25,000.
      </text>
    </g>

    <!-- VPA Syndicate Link -->
    <g transform="translate(14, 160)">
      <rect width="224" height="44" rx="6" fill="#1C1813" stroke="#3D3425" stroke-width="1"/>
      <text x="12" y="16" font-family="'JetBrains Mono', monospace" font-size="8" fill="#9E9688">
        MULE VPA CLUSTER
      </text>
      <text x="12" y="32" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#F3DFB0">
        Cluster #104: 18 Associated Reports
      </text>
    </g>

    <!-- Status Strip -->
    <g transform="translate(14, 214)">
      <rect width="224" height="36" rx="6" fill="#277653" fill-opacity="0.15" stroke="#277653" stroke-width="1"/>
      <text x="12" y="22" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#4ADE80">
        PROTECTION: QR EXECUTION BLOCKED
      </text>
    </g>
  </g>
</svg>
