    <!-- Dispersion Arrows -->
    <path d="M272,64 L310,35" stroke="#B42332" stroke-width="1.2"/>
    <path d="M272,64 L310,64" stroke="#B42332" stroke-width="1.2"/>
    <path d="M272,64 L310,95" stroke="#B42332" stroke-width="1.2"/>

