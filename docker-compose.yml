version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: 4slayers-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: 4slayers
    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: 4slayers-backend
    restart: unless-stopped
    depends_on:
      - mongodb
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - DATABASE_NAME=4slayers
      - SECRET_KEY=4slayers_super_secret_jwt_key_2026_cybersec

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: 4slayers-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  mongodb_data:
